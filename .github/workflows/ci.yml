name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Format check (ruff)
        run: uv run --no-sync ruff format --check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy .

      - name: Tests (pytest with coverage)
        run: uv run --no-sync python -m pytest tests/ --cov --cov-report=term-missing --cov-fail-under=83

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked

      # Advisory baru upstream tidak boleh memblokir merge; review secara berkala.
      - name: Dependency audit (pip-audit)
        run: uv run --no-sync pip-audit --skip-editable
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build API image
        run: docker build .
