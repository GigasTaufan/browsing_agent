# Hook lokal via https://pre-commit.com — jalankan sekali: `uv run pre-commit install`
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.coverage
      - id: end-of-file-fixer
        exclude: ^\.coverage
      - id: check-yaml
        exclude: ^(compose\.yaml|searxng/settings\.yml)$
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
