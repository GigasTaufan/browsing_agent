services:
  # Tanpa profil = default: service inti (api, nginx, redis, searxng) langsung menyala
  # dengan `docker compose up`. Profil hanya untuk pemisahan eksplisit bila diinginkan.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Fail-closed (ADR-0006): nilainya wajib terisi walau .env lupa menulisnya.
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379/0}
      # Provider pencarian: SearXNG internal (self-hosted). DuckDuckGo bisa diblokir/CAPTCHA
      # dari IP server, sehingga default ke SearXNG.
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      # Di container, localhost menunjuk ke API sendiri; alias ini menuju host Docker.
      MLFLOW_TRACKING_URI: ${MLFLOW_CONTAINER_TRACKING_URI:-http://host.docker.internal:5000}
      MLFLOW_EXPERIMENT_ID: ${MLFLOW_EXPERIMENT_ID:-1}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-searxng}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - egress
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env (copy .env.example first)}
      # Engine wikipedia/wikidata/openstreetmap butuh contact_url agar terdaftar.
      SEARXNG_CONTACT_URL: ${SEARXNG_CONTACT_URL:?Set SEARXNG_CONTACT_URL in .env (email admin)}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro,z
    networks:
      - egress
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      api:
        condition: service_healthy
    environment:
      # ADR-0009: key browser (UI_API_KEY) dan key service Nginx->API (UI_TO_API_KEY) terpisah.
      UI_API_KEY: ${UI_API_KEY:?Set UI_API_KEY in .env (copy .env.example first)}
      UI_TO_API_KEY: ${UI_TO_API_KEY:?Set UI_TO_API_KEY in .env (copy .env.example first)}
    ports:
      # Default 8080 (prod); staging di host yang sama pakai NGINX_PORT=8081.
      - "${NGINX_PORT:-8080}:80"
    volumes:
      # Label SELinux shared (:z): prod dan staging boleh membaca aset yang sama.
      - ./frontend:/usr/share/nginx/html:ro,z
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro,z
    networks:
      - backend
      # Nginx butuh satu network non-internal agar port publish 8080 berfungsi;
      # container yang hanya menempel di network internal tidak menerima trafik host.
      - egress
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - "http://127.0.0.1/healthz/ready"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  backend:
    internal: true
  egress: {}
