[project]
name = "browsing-agent"
version = "1.0.0"
description = "Agen browsing web dengan Azure OpenAI dan sumber jawaban."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langchainhub>=0.1.15",
    "ddgs>=9.0.0",
    "selenium>=4.21.0",
    "webdriver-manager>=4.0.1",
    "lxml>=5.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.9.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = ["pytest>=8.2.0"]

[tool.uv]
package = false
